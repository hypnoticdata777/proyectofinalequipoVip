<!doctype html>
<!-- Indica que el documento utiliza HTML5 -->
<html lang="es">
  <!-- Inicio del documento HTML y especifica que el idioma es español -->
<head>
 <!-- Contiene información de configuración de la página -->
  <meta charset="utf-8">
  <!-- Permite mostrar caracteres especiales como acentos y ñ -->
  <title>USF Portal - Universidad Santa Fe</title>
   <!-- Título que aparece en la pestaña del navegador -->
  <base href="/">
   <!-- Define la ruta base para los enlaces de la aplicación -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Hace que la página sea adaptable a dispositivos móviles -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Agrega el ícono que aparece en la pestaña del navegador -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
   <!-- Importa la fuente Roboto desde Google Fonts -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Importa los íconos de Material Design -->
</head>
<body class="mat-typography">
   <!-- Cuerpo principal de la página -->
  <app-root></app-root>
  <!-- Componente principal donde Angular carga toda la aplicación -->
</body>
</html>
