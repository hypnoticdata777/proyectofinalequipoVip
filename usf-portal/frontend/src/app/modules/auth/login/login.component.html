<div class="login-wrapper">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-usf">USF</div>
      <h1 class="universidad-nombre">Universidad Santa Fe</h1>
      <p class="campus-nombre">Campus Paraíso</p>
    </div>

    <div class="divider"></div>

    <div class="portal-info">
      <h2>{{ modoRegistro ? 'Crear Cuenta' : 'Portal Académico' }}</h2>
      <p>{{ modoRegistro ? 'Completa los datos para registrarte' : 'Ingresa con tu email institucional' }}</p>
    </div>

    <div class="alert-error" *ngIf="error">{{ error }}</div>

    <!-- Login -->
    <form *ngIf="!modoRegistro" (ngSubmit)="iniciarSesion()" class="auth-form">
      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" [(ngModel)]="emailLogin" name="emailLogin"
               placeholder="usuario@usf.edu.mx" autocomplete="email" required />
      </div>
      <div class="field-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="passwordLogin" name="passwordLogin"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Iniciar Sesión' }}
      </button>
    </form>

    <!-- Registro -->
    <form *ngIf="modoRegistro" (ngSubmit)="registrarse()" class="auth-form">
      <div class="fields-row">
        <div class="field-group">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Carlos" required />
        </div>
        <div class="field-group">
          <label>Apellido</label>
          <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Sánchez" required />
        </div>
      </div>
      <div class="field-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="emailReg" name="emailReg"
               placeholder="usuario@usf.edu.mx" required />
      </div>
      <div class="field-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="passwordReg" name="passwordReg"
               placeholder="Mínimo 8 caracteres" required />
      </div>
      <div class="fields-row">
        <div class="field-group">
          <label>Rol</label>
          <select [(ngModel)]="rolReg" name="rolReg">
            <option value="alumno">Alumno</option>
            <option value="profesor">Profesor</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="field-group">
          <label>Matrícula <span class="optional">(opcional)</span></label>
          <input type="text" [(ngModel)]="matricula" name="matricula" placeholder="A12345678" />
        </div>
      </div>
      <button type="submit" class="btn-primary" [disabled]="cargando">
        {{ cargando ? 'Registrando…' : 'Crear Cuenta' }}
      </button>
    </form>

    <button class="btn-link" (click)="cambiarModo()">
      {{ modoRegistro ? '¿Ya tienes cuenta? Inicia sesión' : '¿Primera vez? Regístrate' }}
    </button>

    <p class="footer-text">Solo para personal y alumnos de USF</p>
  </div>
</div>
